name: testnet container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-testnet-container
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/xbidlive/xbid-frontend:testnet
            ghcr.io/xbidlive/xbid-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=https://testnet.xbid.live
            NEXT_PUBLIC_API_URL=https://api-testnet.xbid.live
            NEXT_PUBLIC_CHAIN_ID=46630
            NEXT_PUBLIC_CHAIN_NAME=Robinhood Chain Testnet
            NEXT_PUBLIC_CHAIN_RPC_URL=https://rpc.testnet.chain.robinhood.com
            NEXT_PUBLIC_CHAIN_EXPLORER_NAME=Robinhood Testnet Explorer
            NEXT_PUBLIC_CHAIN_EXPLORER_URL=https://explorer.testnet.chain.robinhood.com
            NEXT_PUBLIC_CHAIN_TESTNET=true
            NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
